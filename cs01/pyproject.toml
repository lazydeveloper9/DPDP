[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs01"
version = "0.1.0-alpha"
description = "Full-Stack DPDP Compliance Auditor for India's DPDP Act 2023 & Rules 2025"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pathspec>=1.1",
    "ruamel.yaml>=0.18",
    "sqlglot>=20.0",
    "python-hcl2>=4.0",
    "dockerfile-parse>=2.0",
    "jinja2>=3.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
cs01 = "cs01.cli.main:app"
cs01-gui = "cs01.gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cs01"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
